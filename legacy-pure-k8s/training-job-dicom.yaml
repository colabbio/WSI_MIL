apiVersion: batch/v1
kind: Job
metadata:
  name: abmil-training-job-dicom
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: abmil-trainer
          image: colabbio-abmil:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/src/training.py"]
          # args: ["--data_dir", "/mnt/wsi_data", "--manifest", "/app/datasets/manifest_dicom.csv"]
          volumeMounts:
            - name: wsi-data
              mountPath: /mnt/wsi_data
              readOnly: true
      volumes:
        - name: wsi-data
          persistentVolumeClaim:
            claimName: medvfs-wsi-dicom-pvc
