apiVersion: v1
kind: PersistentVolume
metadata:
  name: medvfs-wsi-pv
  labels:
    type: local
spec:
  storageClassName: local-storage
  capacity:
    storage: 1Ti
  accessModes:
    - ReadOnlyMany
  hostPath:
    path: "/data/home/lolmo/histology"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: medvfs-wsi-pvc
spec:
  storageClassName: local-storage
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 1Ti
