spec:
  template:
    spec:
      containers:
      - name: nginx-sidecar
        image: nginx:alpine
        ports:
        - containerPort: 4081
          name: bridge
          protocol: TCP
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
      volumes:
      - name: nginx-config
        configMap:
          name: omero-nginx-bridge-config
