apiVersion: batch/v1
kind: Job
metadata:
  name: tcga-synthetic-ingestion
  namespace: colabbio-dev
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: fhir-loader
          image: python:3.9-slim
          command:
            - /bin/bash
            - -c
            - |
              pip install requests
              python /app/ingestion/fhir-omop-loader.py
          env:
            - name: FHIR_URL
              value: "http://colabbio-hapi-fhir.colabbio-dev.svc.cluster.local:8080/fhir"
            - name: WSI_MOUNT_DIR
              value: "/mnt/wsi_data/BRCA_AWS/BRCA_raw"
          volumeMounts:
            - name: code-volume
              mountPath: /app
            - name: wsi-data
              mountPath: /mnt/wsi_data
              readOnly: true
      volumes:
        - name: code-volume
          hostPath:
            path: /home/jmolmo/git/colabbio/WSI_MIL
        - name: wsi-data
          persistentVolumeClaim:
            claimName: medvfs-wsi-pvc
