apiVersion: batch/v1
kind: Job
metadata:
  name: medvfs-setup-job
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: medvfs-setup
          image: gcr.io/prevvy1/colabbio/medvfs:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: OMERO_CREDENTIALS
              value: "root:changeit"
          command: ["medvfs", "setup", "--config", "/etc/medvfs/vfs.yaml"]
          volumeMounts:
            - name: config
              mountPath: /etc/medvfs
            - name: fuse-mount
              mountPath: /data/vfs
            - name: wsi-data
              mountPath: /mnt/wsi_data
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: medvfs-config
        - name: fuse-mount
          hostPath:
            path: /data/medvfs
            type: DirectoryOrCreate
        - name: wsi-data
          persistentVolumeClaim:
            claimName: medvfs-wsi-pvc
      imagePullSecrets:
        - name: gcr-secret
